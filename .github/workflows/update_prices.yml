name: Daily Stock Update

on:
  schedule:
    # 台灣時間下午 3:00 執行 (UTC時間 07:00) 禮拜一到禮拜五
    - cron: '0 7 * * 1-5'
  workflow_dispatch: # 允許你隨時手動點擊執行

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允許機器人寫入 index.html

    steps:
      - name: 📥 下載專案程式碼
        uses: actions/checkout@v3

      - name: 🐍 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 安裝所需套件
        run: |
          pip install yfinance pytz
          # 如果您的 py 檔有用到 requests 或 bs4，請取消下面這行的註解
          # pip install requests beautifulsoup4

      - name: 🚀 執行抓價與網頁生成腳本
        run: python update_dashboard.py

      - name: 💾 儲存並推送到 GitHub Pages
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add index.html
          
          # 檢查是否有檔案變更，有變更才 commit，避免機器人報錯
          if git diff --staged --quiet; then
            echo "沒有任何股價更新，跳過 Commit"
          else
            git commit -m "自動更新: 最新收盤價與戰情室數據"
            git push
          fi
